<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
<div class="login-container">
    <div class="login-form">
        <form th:action="@{/login}" method="post" class="login-form-content">
            <img th:src="@{/images/escudo.png}" alt="Escudo" class="login-shield">
            <h4 class="login-title">Login</h4>

            <div th:if="${param.cadastro}" class="login-message">
                <strong>Cadastro realizado com sucesso!</strong>
                <span>Agora você já pode fazer login.</span>
            </div>

            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
            >

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Senha"
                    autocomplete="current-password"
                    required
            >

            <div class="login-button-container">
                <button type="submit">Entrar</button>
            </div>

            <p class="login-redirect-options">
                Ainda não tem cadastro? <br>
                <a th:href="@{/register}">Cadastre-se</a> |
                <a th:href="@{/recoverpassword}">Esqueceu sua senha?</a>
            </p>
        </form>
    </div>
</div>
</body>

</html>
